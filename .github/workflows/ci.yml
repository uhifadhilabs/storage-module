name: CI

# Gatekeeper: every push and pull request must pass the full standard
# (code style -> static analysis -> tests) before it is valid for review.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    # No database service: this bundle owns no entities. It stores bytes, and
    # the local adapter writes them into a temp directory during the tests.

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        # gd is required by the thumbnail tests. imagick is deliberately NOT
        # installed here: CI then exercises the same GD-only path most
        # developer machines have, including the honest "HEIC arrived and
        # nothing on this box can decode it" branch.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, gd, fileinfo
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Code style (php-cs-fixer)
        run: composer cs:check

      - name: Static analysis (PHPStan max)
        run: composer phpstan

      - name: Tests (PHPUnit)
        run: composer test